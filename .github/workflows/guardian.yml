on: [push, pull_request]

jobs:
  security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: python -m pip install checkov==3.4.5

      - name: Run Healthcare Guardian
        run: python guardian.py main.tf